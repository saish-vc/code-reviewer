name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pylint

      - name: Run Python linter (pylint)
        run: |
          pylint app.py models.py database.py static_analysis.py nim_client.py --errors-only || true

      - name: Run Python test suite
        run: |
          pytest test_v2.py test_v3.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── Marketing site (root src/) ────────────────────────────────────────
      - name: Install root Node dependencies (marketing site)
        run: npm ci

      - name: Marketing site build check
        run: npm run build

      # ── Desktop app frontend (revu-app/) ─────────────────────────────────
      - name: Install revu-app Node dependencies
        working-directory: revu-app
        run: npm ci

      - name: revu-app frontend build check (Vite only, no Rust)
        working-directory: revu-app
        run: npm run build
